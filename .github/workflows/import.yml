name: Import module releases
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-import
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.CI_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: module-publishing
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
